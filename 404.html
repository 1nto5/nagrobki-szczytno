<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Nie znaleziono - Wyrób Nagrobków Dariusz Twardowski</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body{margin:0;background:#f4f2ee;color:#1f1d1a;font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
  .box{max-width:520px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(48px,7vw,80px);margin:0 0 8px;letter-spacing:-.015em;color:#1f1d1a}
  h1 em{font-style:italic;color:#8a6b4b;font-weight:400}
  p{color:#3a3733;font-size:16px;line-height:1.55;margin:18px 0 28px;max-width:42ch;margin-left:auto;margin-right:auto}
  a{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-size:14px;letter-spacing:.02em;background:#1f1d1a;color:#f4f2ee;text-decoration:none;transition:background .2s}
  a:hover{background:#8a6b4b}
</style>
</head>
<body>
  <div class="box">
    <h1>404 <em>- nie znaleziono</em></h1>
    <p>Strona, której szukasz, nie istnieje lub została przeniesiona.</p>
    <a href="/">Wróć na stronę główną</a>
  </div>
</body>
</html>
